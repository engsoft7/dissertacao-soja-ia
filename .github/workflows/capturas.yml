# Capturas de tela do aplicativo, desenhadas sem emulador.
#
# Roda os testes de CapturasDeTelaTest (Robolectric + Roborazzi), que desenham
# as telas com dados de exemplo nos temas claro e escuro, e publica os PNGs na
# branch capturas-de-tela, que é sobrescrita a cada execução. Assim quem revisa
# uma mudança de interface vê o resultado sem compilar o aplicativo.
name: Capturas de tela do aplicativo

on:
  push:
    paths:
      - "software/aplicativo_mobile/**"
      - ".github/workflows/capturas.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capturas-de-tela
  cancel-in-progress: true

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Desenha as telas
        working-directory: software/aplicativo_mobile
        run: ./gradlew --no-daemon testDebugUnitTest --tests "*CapturasDeTelaTest*"

      - name: Publica na branch capturas-de-tela
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          origem="$GITHUB_WORKSPACE/software/aplicativo_mobile/app/build/capturas"
          ls "$origem"/*.png
          destino="$RUNNER_TEMP/capturas"
          mkdir -p "$destino" && cp "$origem"/*.png "$destino"/
          cd "$destino"
          {
            echo "# Capturas de tela do aplicativo"
            echo
            echo "Geradas pelo workflow capturas.yml a partir de \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`)."
            echo "Dados de exemplo; telas desenhadas pelo Robolectric num celular de 411 x 891 dp."
            echo
            for f in *.png; do echo "## ${f%.png}"; echo; echo "![${f%.png}]($f)"; echo; done
          } > README.md
          git init -q -b capturas-de-tela
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Capturas de ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas-de-tela

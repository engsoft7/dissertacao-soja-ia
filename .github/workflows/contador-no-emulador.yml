# Roda o contador de vagens num emulador Android: o modelo LiteRT com a
# biblioteca nativa, a entrada no formato certo e o resultado igual ao do
# Python (ContadorVagensAparelhoTest). Os testes de unidade, que rodam na JVM,
# não alcançam a biblioteca nativa.
#
# Roda quando o contador, os modelos ou este arquivo mudam, e sob demanda.
name: Contador de vagens no emulador

on:
  push:
    paths:
      - 'software/aplicativo_mobile/app/src/main/java/com/agrointeligencia/app/ContadorVagens.kt'
      - 'software/aplicativo_mobile/app/src/main/assets/**'
      - 'software/aplicativo_mobile/app/src/androidTest/**'
      - 'software/aplicativo_mobile/gradle/libs.versions.toml'
      - '.github/workflows/contador-no-emulador.yml'
  workflow_dispatch:

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # O emulador x86_64 precisa da aceleração por hardware (KVM).
      - name: Libera o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Roda o teste no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: software/aplicativo_mobile
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Guarda o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-contador-emulador
          path: software/aplicativo_mobile/app/build/reports/androidTests/
          if-no-files-found: ignore

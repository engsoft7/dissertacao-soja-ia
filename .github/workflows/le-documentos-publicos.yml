# Baixa as páginas e os PDFs listados em pesquisa/07_referencias/documentos_publicos.txt,
# extrai o texto e publica tudo na branch documentos-lidos: regimentos e
# resoluções do programa e fontes citadas que o ambiente de desenvolvimento
# não alcança. Cada documento vira um .txt; as páginas web trazem também a
# lista de links, para achar os documentos que elas apontam.
name: Lê documentos públicos

on:
  push:
    paths:
      - 'pesquisa/07_referencias/documentos_publicos.txt'
      - '.github/workflows/le-documentos-publicos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  le:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala o extrator de PDF e o navegador
        run: |
          pip install --quiet pypdf playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Baixa e extrai o texto
        run: |
          mkdir -p "$RUNNER_TEMP/lidos"
          python3 - "$RUNNER_TEMP/lidos" <<'PY'
          import html, re, sys, urllib.parse, urllib.request
          from pypdf import PdfReader
          from pathlib import Path
          destino = Path(sys.argv[1])
          linhas = [l.strip() for l in open("pesquisa/07_referencias/documentos_publicos.txt", encoding="utf-8")
                    if l.strip() and not l.startswith("#")]
          urls = [l for l in linhas if not l.startswith("navegador ")]
          no_navegador = [l.split(" ", 1)[1] for l in linhas if l.startswith("navegador ")]
          indice = []
          for url in urls:
              nome = re.sub(r"[^A-Za-z0-9]+", "_", urllib.parse.unquote(url).split("//", 1)[1])[:80].strip("_")
              alvo = urllib.parse.quote(url, safe=":/?=&%#")
              try:
                  req = urllib.request.Request(alvo, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      dados, tipo, final = r.read(), r.headers.get("Content-Type", ""), r.geturl()
              except Exception as e:
                  indice.append(f"FALHOU  {url}  {type(e).__name__}: {e}")
                  continue
              if dados[:4] == b"%PDF" or "pdf" in tipo:
                  (destino / f"{nome}.pdf").write_bytes(dados)
                  texto = "\n\n".join((pg.extract_text() or "") for pg in PdfReader(str(destino / f"{nome}.pdf")).pages)
              else:
                  pagina = dados.decode("utf-8", "replace")
                  ancoras = re.findall(r'(?is)<a[^>]+href="([^"#]+)"[^>]*>(.*?)</a>', pagina)
                  limpa = lambda t: re.sub(r"<[^>]+>|[ \t\r\n]+", " ", t).strip()[:120]
                  links = sorted({urllib.parse.urljoin(final, h) + "  [" + limpa(t) + "]" for h, t in ancoras})
                  corpo = re.sub(r"(?is)<(script|style).*?</\1>", " ", pagina)
                  texto = html.unescape(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", corpo)))
                  texto += "\n\nLINKS:\n" + "\n".join(links)
              (destino / f"{nome}.txt").write_text(texto, encoding="utf-8")
              indice.append(f"OK      {url}  ->  {nome}.txt ({len(texto)} caracteres)")
          # Sites que recusam acesso automatizado: abertos no Chromium, como num navegador comum.
          if no_navegador:
              from playwright.sync_api import sync_playwright
              with sync_playwright() as pw:
                  nav = pw.chromium.launch()
                  pagina_nav = nav.new_page(locale="pt-BR")
                  for url in no_navegador:
                      nome = "navegador_" + re.sub(r"[^A-Za-z0-9]+", "_", url.split("//", 1)[1])[:70].strip("_")
                      try:
                          resp = pagina_nav.goto(url, wait_until="networkidle", timeout=90000)
                          pagina_nav.wait_for_timeout(3000)
                          texto = pagina_nav.inner_text("body")
                          (destino / f"{nome}.txt").write_text(texto, encoding="utf-8")
                          indice.append(f"OK      {url}  ->  {nome}.txt (HTTP {resp.status if resp else '?'}, {len(texto)} caracteres, navegador)")
                      except Exception as e:
                          indice.append(f"FALHOU  {url}  navegador: {type(e).__name__}: {e}")
                  nav.close()
          (destino / "INDICE.txt").write_text("\n".join(indice) + "\n", encoding="utf-8")
          print("\n".join(indice))
          PY

      - name: Publica na branch documentos-lidos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP/lidos"
          git init -q -b documentos-lidos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Documentos lidos em ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -q -f "$url" HEAD:documentos-lidos

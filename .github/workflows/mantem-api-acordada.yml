# Consulta a API e registra em quanto tempo ela responde.
#
# No plano gratuito do Render, um serviço sem acesso por 15 minutos é desligado,
# e a consulta seguinte espera de 30 a 60 segundos ele subir de novo. Acordada,
# a API responde em menos de 1 segundo. Cada execução mostra o tempo da resposta
# e avisa quando ele indica que a API estava dormindo.
#
# O agendamento pede uma consulta a cada 10 minutos, mas o GitHub não garante o
# horário das rotinas agendadas: neste repositório, de 6 a 16/11/2026, foram 41
# execuções em 10 dias, com 3 a 10 horas entre uma e outra. Sozinha, portanto,
# esta rotina não mantém a API acordada; ela serve de sentinela.
#
# Teste de sono, para saber se a API dorme:
#   Actions > "Mantém a API acordada" > Run workflow > espera: 25
# A rotina consulta, fica esse tempo sem consultar e consulta de novo. Se a
# segunda resposta demora, a API dormiu no intervalo.
name: Mantém a API acordada

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      espera:
        description: "Teste de sono: minutos sem consultar antes de uma segunda consulta (0 = uma consulta só; até 40)"
        required: false
        default: "0"

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      API: https://agrointeligencia-api.onrender.com/api/ping
      ESPERA: ${{ inputs.espera || '0' }}
      # A partir deste tempo de resposta, em segundos, a API estava dormindo.
      LIMITE: "10"
    steps:
      - name: Consulta /api/ping
        run: |
          # Uma consulta, com até três tentativas. Diz o tempo da resposta e
          # guarda em $dormia se ele passou do limite; uma resposta que só veio
          # numa tentativa seguinte também conta como API dormindo.
          consulta() {
            dormia=nao
            inicio=$SECONDS
            for i in 1 2 3; do
              if t=$(curl -fsS --max-time 90 -D "$RUNNER_TEMP/cabecalhos" -o "$RUNNER_TEMP/resposta" \
                          -w '%{time_total}' "$API"); then
                if [ "$i" -gt 1 ]; then t=$((SECONDS - inicio)); fi
                echo "$1: resposta em $t s: $(cat "$RUNNER_TEMP/resposta")"
                if awk -v t="$t" -v limite="$LIMITE" 'BEGIN { exit !(t >= limite) }'; then
                  dormia=sim
                  echo "::warning::$1: a API estava dormindo e levou $t s para responder."
                fi
                return 0
              fi
              sleep 20
            done
            dormia=sem-resposta
            echo "::warning::$1: a API não respondeu em três tentativas."
          }

          case "$ESPERA" in ''|*[!0-9]*) ESPERA=0 ;; esac
          if [ "$ESPERA" -gt 40 ]; then ESPERA=40; fi

          consulta "Consulta"
          if [ "$ESPERA" -eq 0 ]; then exit 0; fi

          # Teste de sono: o que respondeu, a espera e a segunda consulta.
          grep -iE '^(server|x-render[a-z-]*|cf-cache-status):' "$RUNNER_TEMP/cabecalhos" || true
          echo "Teste de sono: $ESPERA minutos sem consultar."
          sleep $((ESPERA * 60))
          consulta "Depois de $ESPERA minutos"
          case "$dormia" in
            sim) resultado="A API dormiu: depois de $ESPERA minutos sem consulta desta rotina, a resposta levou $t s. Nada mais a mantém acordada." ;;
            nao) resultado="A API continuou acordada: depois de $ESPERA minutos sem consulta desta rotina, a resposta levou $t s. Ou o plano do Render não desliga o serviço, ou outro acesso o manteve ligado." ;;
            *)   resultado="A API não respondeu depois de $ESPERA minutos sem consulta." ;;
          esac
          echo "$resultado"
          echo "$resultado" >> "$GITHUB_STEP_SUMMARY"

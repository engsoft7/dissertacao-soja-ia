# Janela de plantio da soja: ZARC (tábua de risco, dado aberto do Ministério da
# Agricultura) e calendário de semeadura e vazio sanitário (Portaria SDA/MAPA
# nº 1.579/2026, lida do Diário Oficial). coleta_plantio.py grava os arquivos
# em pesquisa/dados/plantio/, que a API e o painel leem.
#
# - Numa branch de trabalho (push no coletor ou neste workflow): grava os
#   arquivos na própria branch.
# - Na main, todo mês e sob demanda: se a fonte mudou, abre um PR e o mergeia,
#   como o workflow mensal da base. O ZARC e o calendário mudam uma vez por
#   safra; a conferência mensal pega a portaria da safra seguinte e uma revisão.
name: Janela de plantio

on:
  push:
    branches-ignore: [main]
    paths:
      - "software/automacao_github/coleta_plantio.py"
      - ".github/workflows/plantio.yml"
  schedule:
    - cron: "41 11 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plantio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests pytest
      - name: Testa a leitura da portaria
        run: python -m pytest software/automacao_github/test_coleta_plantio.py -q
      # TEMPORÁRIO: compara formas de consulta à busca do Diário Oficial.
      - name: Diagnóstico da busca do DOU
        if: github.ref_name != github.event.repository.default_branch
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, re, requests
          URL = "https://www.in.gov.br/consulta/-/buscar/dou"
          UA = {"User-Agent": "AgroInteligencia-Dissertacao/1.0 (UFPA; pesquisa academica)"}
          NAV = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36",
                 "Accept": "text/html,application/xhtml+xml", "Accept-Language": "pt-BR,pt;q=0.9"}
          base = {"s": "todos", "sortType": "0"}
          variantes = [
              ("atual", UA, {"q": '"calendário de semeadura" soja', "exactDate": "personalizado",
                             "publishFrom": "01-01-2025", "publishTo": "14-11-2026", "delta": "50"}),
              ("frase, tudo", UA, {"q": '"calendário de semeadura"', "exactDate": "all"}),
              ("frase, tudo, navegador", NAV, {"q": '"calendário de semeadura"', "exactDate": "all"}),
              ("palavras, tudo", UA, {"q": "calendário de semeadura soja", "exactDate": "all"}),
              ("frase, ano", UA, {"q": '"calendário de semeadura"', "exactDate": "ano"}),
              ("frase, do1, ano", UA, {"q": '"calendário de semeadura"', "exactDate": "ano", "s": "do1"}),
              ("ro-dou, 364 dias", UA, {"q": 'tudo-"calendário de semeadura"', "exactDate": "personalizado",
                                        "publishFrom": "15-11-2025", "publishTo": "14-11-2026"}),
              ("frase, 364 dias", UA, {"q": '"calendário de semeadura"', "exactDate": "personalizado",
                                       "publishFrom": "15-11-2025", "publishTo": "14-11-2026"}),
              ("frase, abril 2026", UA, {"q": '"calendário de semeadura"', "exactDate": "personalizado",
                                         "publishFrom": "01-04-2026", "publishTo": "30-04-2026"}),
              ("frase, barras", UA, {"q": '"calendário de semeadura"', "exactDate": "personalizado",
                                     "publishFrom": "01/01/2026", "publishTo": "14/11/2026"}),
              ("1.579, ano", UA, {"q": '"1.579"', "exactDate": "ano", "s": "do1"}),
              ("soja, mês", UA, {"q": "soja", "exactDate": "mes"}),
              ("asterisco, dia 10/04", UA, {"q": "*", "exactDate": "personalizado",
                                            "publishFrom": "10-04-2026", "publishTo": "10-04-2026", "s": "do1"}),
          ]
          for nome, cab, p in variantes:
              try:
                  r = requests.get(URL, headers=cab, params={**base, **p}, timeout=90)
                  m = re.search(r'id="_br_com_seatecnologia_in_buscadou_BuscaDouPortlet_params"[^>]*>(.*?)</script>', r.text, re.S)
                  hits = (json.loads(m.group(1)).get("jsonArray") or []) if m else None
                  total = re.search(r'"?totalArquivos"?\s*[:=]\s*"?(\d+)', r.text)
                  print(f"== {nome}: {r.status_code}, {len(r.text)} car., atos={None if hits is None else len(hits)}"
                        f", total={total.group(1) if total else '?'}")
                  print("   ", r.url)
                  for h in (hits or [])[:4]:
                      print("    -", h.get("pubDate"), "|", h.get("pubName"), "|", (h.get("title") or "")[:90], "|", h.get("urlTitle"))
              except Exception as e:
                  print(f"== {nome}: {type(e).__name__}: {e}")
          PY
      - name: Coleta o ZARC e o calendário
        run: python software/automacao_github/coleta_plantio.py

      - name: Grava na branch de trabalho
        if: github.ref_name != github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pesquisa/dados/plantio
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Janela de plantio: ZARC e calendário de semeadura (${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      - name: Abre o PR na main
        id: cpr
        if: github.ref_name == github.event.repository.default_branch
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automacao/janela-de-plantio
          add-paths: pesquisa/dados/plantio/*
          commit-message: "Janela de plantio: ZARC e calendário de semeadura atualizados"
          title: "Janela de plantio: ZARC e calendário de semeadura atualizados"
          body: |
            Gerado pelo workflow `plantio.yml` a partir da tábua de risco do ZARC
            (dados abertos do Ministério da Agricultura) e da portaria do
            calendário de semeadura e vazio sanitário, lida do Diário Oficial.
          delete-branch: true

      - name: Mergeia o PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" \
            --repo "${{ github.repository }}"

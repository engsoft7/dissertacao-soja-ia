# Janela de plantio da soja: ZARC (tábua de risco, dado aberto do Ministério da
# Agricultura) e calendário de semeadura e vazio sanitário (Portaria SDA/MAPA
# nº 1.579/2026, lida do Diário Oficial). coleta_plantio.py grava os arquivos
# em pesquisa/dados/plantio/, que a API e o painel leem.
#
# - Numa branch de trabalho (push no coletor ou neste workflow): grava os
#   arquivos na própria branch.
# - Na main, todo mês e sob demanda: se a fonte mudou, abre um PR e o mergeia,
#   como o workflow mensal da base. O ZARC e o calendário mudam uma vez por
#   safra; a conferência mensal pega a portaria da safra seguinte e uma revisão.
name: Janela de plantio

on:
  push:
    branches-ignore: [main]
    paths:
      - "software/automacao_github/coleta_plantio.py"
      - ".github/workflows/plantio.yml"
  schedule:
    - cron: "41 11 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plantio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests pytest
      - name: Testa a leitura da portaria
        run: python -m pytest software/automacao_github/test_coleta_plantio.py -q
      # TEMPORÁRIO: compara formas de consulta à busca do Diário Oficial.
      - name: Diagnóstico da busca do DOU
        if: github.ref_name != github.event.repository.default_branch
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, re, requests
          URL = "https://www.in.gov.br/consulta/-/buscar/dou"
          UA = {"User-Agent": "AgroInteligencia-Dissertacao/1.0 (UFPA; pesquisa academica)"}
          F = '"calendário de semeadura"'
          ANO = {"exactDate": "personalizado", "publishFrom": "15-11-2025", "publishTo": "14-11-2026"}
          def busca(p):
              r = requests.get(URL, headers=UA, params={"s": "todos", "sortType": "0", **p}, timeout=90)
              m = re.search(r'id="_br_com_seatecnologia_in_buscadou_BuscaDouPortlet_params"[^>]*>(.*?)</script>', r.text, re.S)
              return r, ((json.loads(m.group(1)).get("jsonArray") or []) if m else None)
          def mostra(nome, p, todos=False):
              try:
                  r, hits = busca(p)
              except Exception as e:
                  print(f"== {nome}: {type(e).__name__}: {e}"); return []
              hits = hits or []
              sda = [h for h in hits if "SDA/MAPA" in (h.get("title") or "")]
              datas = sorted({h.get("pubDate", "") for h in hits}, key=lambda d: d[6:] + d[3:5] + d[:2])
              print(f"== {nome}: {r.status_code}, atos={len(hits)}, SDA/MAPA={len(sda)}, datas {datas[:1]}..{datas[-1:]}")
              print("   ", r.url)
              for h in (hits if todos else (sda or hits)[:3]):
                  print("    -", h.get("pubDate"), "|", (h.get("title") or "")[:70], "|", texto(h.get("content"))[:90])
              return hits
          def texto(c):
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", c or ""))
          h1 = mostra("frase, 364 dias, página 1 (todos)", {"q": F, **ANO}, todos=True)
          if h1:
              print("chaves de um ato:", sorted(h1[-1].keys()))
              u = h1[-1]
              print("último ato:", {k: u.get(k) for k in ("classPK", "displayDateSortable", "score", "id", "pubOrder")})
          mostra("frase, 364 dias, delta 50", {"q": F, **ANO, "delta": "50"})
          mostra("frase, 22 meses", {"q": F, "exactDate": "personalizado", "publishFrom": "01-01-2025", "publishTo": "14-11-2026"})
          mostra("frase + soja, 364 dias", {"q": F + " soja", **ANO})
          mostra("+frase +vazio", {"q": '+' + F + ' +"vazio sanitário"', **ANO})
          mostra("frase AND vazio", {"q": F + ' AND "vazio sanitário"', **ANO})
          mostra("duas frases", {"q": F + ' "vazio sanitário"', **ANO})
          mostra("só vazio sanitário", {"q": '"vazio sanitário"', **ANO})
          mostra("órgão SDA", {"q": F, **ANO, "orgPrin": "Ministério da Agricultura e Pecuária",
                               "orgSub": "Secretaria de Defesa Agropecuária"})
          mostra("ementa", {"q": 'ddm__text__21040__ementa_pt_BR-' + F, **ANO})
          mostra("conteúdo", {"q": 'ddm__text__21040__texto_pt_BR-' + F, **ANO})
          mostra("título SDA/MAPA", {"q": 'title_pt_BR-"SDA/MAPA"', **ANO})
          mostra("relevância (sortType 1)", {"q": F, **ANO, "sortType": "1"})
          mostra("artType Portaria", {"q": F, **ANO, "artType": "Portaria"})
          if h1:
              u = h1[-1]
              for nome, extra in [
                  ("página 2, search_after", {"currentPage": "1", "newPage": "2", "score": str(u.get("score", 0)),
                                              "id": str(u.get("classPK", "")), "displayDate": str(u.get("displayDateSortable", ""))}),
                  ("página 2, start", {"start": "20"}),
                  ("página 2, cur", {"cur": "2"}),
              ]:
                  h2 = mostra(nome, {"q": F, **ANO, **extra})
                  print("    mesma primeira?", bool(h2) and h2[0].get("urlTitle") == h1[0].get("urlTitle"))
          PY
      - name: Coleta o ZARC e o calendário
        run: python software/automacao_github/coleta_plantio.py

      - name: Grava na branch de trabalho
        if: github.ref_name != github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pesquisa/dados/plantio
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Janela de plantio: ZARC e calendário de semeadura (${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      - name: Abre o PR na main
        id: cpr
        if: github.ref_name == github.event.repository.default_branch
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automacao/janela-de-plantio
          add-paths: pesquisa/dados/plantio/*
          commit-message: "Janela de plantio: ZARC e calendário de semeadura atualizados"
          title: "Janela de plantio: ZARC e calendário de semeadura atualizados"
          body: |
            Gerado pelo workflow `plantio.yml` a partir da tábua de risco do ZARC
            (dados abertos do Ministério da Agricultura) e da portaria do
            calendário de semeadura e vazio sanitário, lida do Diário Oficial.
          delete-branch: true

      - name: Mergeia o PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" \
            --repo "${{ github.repository }}"

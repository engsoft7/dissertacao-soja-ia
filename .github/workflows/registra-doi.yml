# Registra no REGISTRO_INPI.md o DOI que o Zenodo atribui a cada Release.
#
# Na publicação de um Release: calcula o resumo criptográfico sobre a etiqueta,
# espera o Zenodo atribuir o DOI de versão e registra a versão no
# REGISTRO_INPI.md e no CITATION.cff. Versão sem linha na tabela ganha linha,
# texto (arquivos-fonte que entram, mudam e saem) e referência do DOI; versão já
# preparada à mão é conferida contra a etiqueta e só recebe o DOI. Abre um PR e
# faz o merge dele, que fica como registro auditável do que mudou. Se o resumo
# não conferir, ou o DOI não aparecer no prazo, nada é mergeado: abre uma issue.
#
# Disparo manual (aba Actions) com a etiqueta, para repetir ou para um Release
# publicado antes deste workflow existir.
name: Registra o DOI do Zenodo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta do Release (ex.: v2.4.7)"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  doi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ETIQUETA: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # A edição é feita sobre a main; as etiquetas vêm junto para a conferência.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: pip install --quiet requests

      - name: Registra a versão e o DOI
        id: doi
        env:
          TITULO: ${{ github.event.release.name }}
          PUBLICADO_EM: ${{ github.event.release.published_at }}
        run: |
          PUBLICADO=$(date -u -d "$PUBLICADO_EM" +%d/%m/%Y 2>/dev/null || date -u +%d/%m/%Y)
          [ -n "$PUBLICADO_EM" ] || PUBLICADO=$(date -u +%d/%m/%Y)
          python software/automacao_github/registra_doi.py "$ETIQUETA" --esperar-min 40 \
            --publicado "$PUBLICADO" --titulo "$TITULO"

      - name: Abre PR com o DOI
        id: cpr
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automacao/doi-${{ env.ETIQUETA }}
          add-paths: |
            REGISTRO_INPI.md
            CITATION.cff
          commit-message: "Registra a ${{ env.ETIQUETA }} e o DOI dela"
          title: "Registra a ${{ env.ETIQUETA }} e o DOI dela"
          body: |
            DOI de versão da `${{ env.ETIQUETA }}`: `${{ steps.doi.outputs.doi }}`, lido da API do Zenodo.

            O resumo criptográfico foi calculado sobre uma cópia limpa da etiqueta (commit `${{ steps.doi.outputs.commit }}`). Se a versão já tinha linha na tabela da seção 9.1, o valor foi conferido contra ela; se não tinha, a linha, o texto da versão e a citação foram escritos a partir da etiqueta.

            Gerado e mergeado pelo workflow `registra-doi.yml`.
          delete-branch: true

      # Só chega aqui o que passou pela conferência do resumo criptográfico e
      # tem o DOI lido do Zenodo; o PR só altera o REGISTRO_INPI.md.
      - name: Mergeia o PR do DOI
        if: success() && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" \
            --repo "${{ github.repository }}" --merge --delete-branch \
            --subject "Registra a ${ETIQUETA} e o DOI dela"

      - name: Abre issue quando não dá para registrar
        if: failure()
        uses: actions/github-script@v7
        env:
          MOTIVO: ${{ steps.doi.outputs.motivo }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `DOI da ${process.env.ETIQUETA} não registrado automaticamente`,
              body: [
                `O workflow \`registra-doi.yml\` não registrou o DOI da \`${process.env.ETIQUETA}\`.`,
                '',
                `Motivo: ${process.env.MOTIVO || 'ver o log da execução'}.`,
                '',
                `Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Se o resumo criptográfico não conferiu, a etiqueta não corresponde à linha da tabela: confira antes de registrar o DOI à mão.',
              ].join('\n'),
            });

# Treina o contador de vagens de soja com a base YOLO POD (CC BY 4.0) e
# publica pesos, métricas e exemplos na branch modelo-contagem-vagens.
#
# Roda no Actions porque o ambiente de desenvolvimento não alcança o Hugging
# Face. CPU basta: a rede é uma MobileNetV3 e a base tem 1.448 fotos. Roda
# quando o script de treino ou este arquivo mudam, e sob demanda (o gatilho
# por caminho existe porque workflow_dispatch só alcança workflows que já
# estão no branch padrão).
name: Treina contador de vagens

on:
  push:
    paths:
      - 'pesquisa/09_contagem_por_imagem/treina_contador_vagens.py'
      - '.github/workflows/treina-contador-vagens.yml'
  workflow_dispatch:
    inputs:
      epocas:
        description: "Épocas de treino"
        default: "36"
      versao:
        description: "Pasta da versão na branch modelo-contagem-vagens"
        default: "v3"

permissions:
  contents: write

jobs:
  treino:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PyTorch só de CPU: o pacote padrão traz as bibliotecas de GPU, que
      # aqui só ocupariam disco e tempo de instalação.
      - name: Instala dependências
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet scipy pillow huggingface_hub onnx onnxscript onnxruntime

      - name: Guarda a base entre execuções
        uses: actions/cache@v4
        with:
          path: dados_yolopod
          key: yolopod-v1

      - name: Treina e avalia
        run: |
          python pesquisa/09_contagem_por_imagem/treina_contador_vagens.py \
            --saida "$RUNNER_TEMP/modelo" --dados dados_yolopod \
            --epocas "${{ github.event.inputs.epocas || '36' }}" --minutos 280

      - name: Guarda os arquivos do treino
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contador-vagens
          path: ${{ runner.temp }}/modelo
          if-no-files-found: ignore

      # Cada versão fica na sua pasta, e as anteriores continuam lá para
      # comparação. A versão 1 foi publicada na raiz da branch; na primeira
      # publicação depois dela, seus arquivos passam para v1/.
      - name: Publica na branch modelo-contagem-vagens
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ github.event.inputs.versao || 'v3' }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          destino="$RUNNER_TEMP/branch"
          if git clone -q --depth 1 -b modelo-contagem-vagens "$url" "$destino"; then
            cd "$destino"
            if [ -f LEIAME.md ]; then
              mkdir -p v1
              git mv LEIAME.md contador_vagens.onnx contador_vagens.pt metricas.json teste_por_imagem.json exemplos v1/
            fi
          else
            mkdir -p "$destino" && cd "$destino" && git init -q -b modelo-contagem-vagens
          fi
          rm -rf "$VERSAO" && mkdir -p "$VERSAO" && cp -r "$RUNNER_TEMP/modelo/." "$VERSAO/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Contador de vagens ${VERSAO} treinado em ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -q "$url" HEAD:modelo-contagem-vagens

[pytest]
testpaths = software

# software/dashboard_web/test_meta.py não é um teste: é um script Streamlit de
# diagnóstico de tema que ficou com o prefixo "test_" por acidente de nome.
# Importá-lo na coleta exige o streamlit instalado e não verifica nada. O
# arquivo consta da tabela de hashes do depósito no INPI (REGISTRO_INPI.md),
# por isso não é removido — apenas fica fora da coleta.
addopts = --ignore=software/dashboard_web/test_meta.py
